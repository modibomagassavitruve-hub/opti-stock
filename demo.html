<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Opti-Stock — Démo</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.4rem; }
  section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
  input[type=file] { display: block; margin: 12px 0; }
  button { padding: 8px 16px; cursor: pointer; }
  pre { background: #f5f5f5; padding: 12px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; }
  .erreur { color: #b00020; }
  label { font-size: 0.9rem; color: #555; }
</style>
</head>
<body>
<h1>Opti-Stock — démo</h1>
<p>Adresse de l'API : <input id="api" value="http://localhost:8000" size="30"></p>

<section>
  <h2>Identifier une monture</h2>
  <input type="file" id="photoMonture" accept="image/*">
  <label>Nombre de résultats : <input type="number" id="k" value="5" min="1" max="20" style="width:4em"></label>
  <button onclick="identifier()">Identifier</button>
  <pre id="resultatIdentifier"></pre>
</section>

<section>
  <h2>Lire une étiquette</h2>
  <input type="file" id="photoEtiquette" accept="image/*">
  <button onclick="lireEtiquette()">Lire l'étiquette</button>
  <pre id="resultatEtiquette"></pre>
</section>

<script>
function apiUrl() { return document.getElementById('api').value.replace(/\/$/, ''); }

async function envoyer(endpoint, fichierInput, zoneResultat, params = '') {
  const fichier = fichierInput.files[0];
  zoneResultat.textContent = '';
  if (!fichier) { zoneResultat.textContent = 'Choisis une photo d\'abord.'; zoneResultat.className = 'erreur'; return; }
  const donnees = new FormData();
  donnees.append('photo', fichier);
  zoneResultat.textContent = 'Calcul en cours...';
  zoneResultat.className = '';
  try {
    const reponse = await fetch(`${apiUrl()}${endpoint}${params}`, { method: 'POST', body: donnees });
    const corps = await reponse.json();
    if (!reponse.ok) throw new Error(corps.detail || reponse.statusText);
    zoneResultat.textContent = JSON.stringify(corps, null, 2);
  } catch (e) {
    zoneResultat.textContent = 'Erreur : ' + e.message;
    zoneResultat.className = 'erreur';
  }
}

function identifier() {
  const k = document.getElementById('k').value || 5;
  envoyer('/identifier', document.getElementById('photoMonture'), document.getElementById('resultatIdentifier'), `?k=${k}`);
}
function lireEtiquette() {
  envoyer('/lire-etiquette', document.getElementById('photoEtiquette'), document.getElementById('resultatEtiquette'));
}
</script>
</body>
</html>
