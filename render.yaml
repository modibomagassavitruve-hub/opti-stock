# Déploiement Render, offre gratuite.
#
# Mode minimal imposé : les 512 Mo du gratuit ne peuvent pas contenir EasyOCR, qui embarque
# PyTorch et dépasse 2 Go sous charge (mesuré dans un conteneur Linux). L'application sert donc
# la saisie manuelle, le stock, l'inventaire et le réseau -- tout sauf la reconnaissance par
# photo et la lecture d'étiquette. L'interface masque d'elle-même ce qui n'est pas disponible,
# en interrogeant /sante.
#
# Deux limites de l'offre gratuite, à connaître avant de s'y fier :
#   - le service s'endort après 15 minutes sans visite, et met 30 à 60 s à se réveiller.
#     Un service de ping extérieur gratuit toutes les 5 minutes le garde éveillé.
#   - pas de disque persistant : boutiques inscrites et stock disparaissent à chaque
#     redéploiement. Sur un salon d'une journée, les inscriptions sont vos contacts : notez-les.
#
services:
  - type: web
    name: opti-stock
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements-serveur.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /sante
    envVars:
      - key: OPTI_STOCK_SANS_OCR
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.7"
