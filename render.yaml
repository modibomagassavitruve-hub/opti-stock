# Déploiement Render. À connecter à un dépôt GitHub depuis le tableau de bord Render.
#
# LE MODÈLE N'EST PAS DANS CE DÉPÔT. data/ n'est pas versionné : il contient l'inventaire
# réel d'une boutique et les photos de ses montures. Une instance déployée depuis ce dépôt
# servira donc la saisie, l'OCR d'étiquette, le stock, l'inventaire et le réseau -- tout sauf
# l'identification par similarité, qui a besoin de data/catalogue.npz et data/tete.pt.
# Pour l'activer : construire le catalogue depuis ses propres photos (voir le README) et
# déployer depuis un dépôt privé qui les inclut.
#
# CHOIX DU FORFAIT -- la seule décision qui compte ici.
# Mesuré sur cette application : 440 Mo de pic sous 12 requêtes simultanées, sur macOS qui
# compresse la mémoire. Sous Linux, compter davantage. Le forfait gratuit et le Starter
# plafonnent à 512 Mo : l'instance serait tuée dès les premières requêtes parallèles.
# D'où `standard` (2 Go). Le gratuit est de toute façon inutilisable pour une démonstration :
# il met l'instance en veille après 15 minutes, et le réveil demande le démarrage du
# conteneur PLUS le chargement du modèle -- de l'ordre de la minute et demie.
#
# Pour un salon, préférer ./demarrer_demo.sh : tunnel immédiat, pleine vitesse, aucun coût.
#
services:
  - type: web
    name: opti-stock
    runtime: docker
    plan: standard          # 2 Go. free et starter (512 Mo) ne suffisent pas, voir ci-dessus.
    region: frankfurt
    healthCheckPath: /sante
    envVars:
      # Le journal des identifications validées est la seule mesure de fiabilité en conditions
      # réelles, et il s'accumule sur des semaines. Sans disque monté, il disparaîtrait à
      # chaque redéploiement -- avec le stock et les fiches, qui vivent au même endroit.
      - key: OPTI_STOCK_JOURNAL
        value: /journal
    disk:
      name: journal
      mountPath: /journal
      sizeGB: 1
